name: nutrition_platform
description: "Nutrition Platform — native Flutter port of the coded design prototype."
publish_to: 'none'
version: 0.1.0+1

# This is the native mobile counterpart to ../app (Vite/React/shadcn web prototype).
# ENGINEERING-PLAN.md §3 names this the mobile stack going forward, replacing the
# earlier Expo + React Native Reusables recommendation. See ../app-flutter/README.md
# for what is and isn't ported, and why.

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  hugeicons: ^1.1.7
  flutter_animate: ^4.5.2
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/recipe-exemplars/
    - assets/images/figma/
    - assets/images/figma/home/
    - assets/images/eat-out/
    - assets/images/badges/
  fonts:
    # Display headlines only, per the new Figma redesign (2026-08-06) — large
    # hero/section headings ("Real meals with the macros worked out.", "Cook",
    # "Pick an order"). Everything else moved back to Satoshi.
    - family: Galantic
      fonts:
        - asset: assets/fonts/galantic.regular.otf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    # Restored from git (f198437) — the Figma redesign uses "Satoshi Variable"
    # for greetings, card titles, stat figures, and nav labels throughout.
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
